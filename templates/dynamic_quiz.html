<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 AI Quiz – {{ video_name }} | EnviroLearn</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Courier New', Courier, monospace;
    background:
        linear-gradient(rgba(0,0,0,0.38), rgba(0,0,0,0.38)),
        url("{{ url_for('static', filename='new1.jpeg') }}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
    color:white;
    padding:20px;
}

/* ── Back button ── */
.top-right{
    position:fixed;
    top:20px;
    right:30px;
    z-index:1000;
}
.back-btn{
    background:white;
    color:#2ecc71;
    padding:10px 18px;
    font-size:16px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    transition:0.3s ease;
}
.back-btn:hover{background:#e8fff1;transform:scale(1.05);}

/* ── Title ── */
.title{
    font-size:38px;
    text-align:center;
    padding-top:20px;
    font-weight:bold;
}
.ai-badge{
    display:inline-block;
    background:linear-gradient(135deg,#8e44ad,#3498db);
    color:white;
    font-size:13px;
    padding:3px 10px;
    border-radius:20px;
    margin-left:8px;
    vertical-align:middle;
}

/* ── Loading screen ── */
#loadingBox{
    max-width:600px;
    margin:60px auto;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(6px);
    border-radius:20px;
    padding:50px 30px;
    text-align:center;
}
.spinner{
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,0.3);
    border-top:6px solid #2ecc71;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 20px auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Quiz box ── */
.quizBox{
    background:white;
    color:black;
    max-width:700px;
    width:100%;
    margin:30px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.35);
    display:none;
}
.progress-bar-wrap{
    background:#eee;
    border-radius:10px;
    height:8px;
    margin-bottom:20px;
    overflow:hidden;
}
.progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,#2ecc71,#27ae60);
    border-radius:10px;
    transition:width 0.4s ease;
}
.timer{
    font-size:18px;
    color:red;
    font-weight:bold;
    text-align:right;
    margin-bottom:10px;
}
.q-counter{
    font-size:14px;
    color:#888;
    margin-bottom:8px;
}
.question{
    font-size:21px;
    font-weight:bold;
    margin-bottom:20px;
    line-height:1.5;
}
.option{
    background:#f1f1f1;
    padding:13px 16px;
    margin:9px 0;
    border-radius:9px;
    cursor:pointer;
    transition:0.25s;
    font-size:15px;
    border:2px solid transparent;
}
.option:hover{background:#dff5e1;border-color:#2ecc71;}
.correct{background:#b7f5c5 !important;border-color:#27ae60 !important;}
.wrong{background:#f5b7b7 !important;border-color:#e74c3c !important;}
.option.disabled{pointer-events:none;}

/* Explanation box */
.explanation{
    margin-top:14px;
    padding:12px 16px;
    background:#fffde7;
    border-left:4px solid #f39c12;
    border-radius:0 8px 8px 0;
    font-size:14px;
    display:none;
    color:#555;
}

/* ── Final screen ── */
.result{text-align:center;font-size:26px;font-weight:bold;}
.emoji{font-size:60px;margin-bottom:10px;}

/* ── Responsive ── */
@media(max-width:768px){
    .title{font-size:26px;}
    .question{font-size:17px;}
    .option{font-size:13px;padding:10px;}
    .timer{font-size:15px;}
}
</style>
</head>
<body>

<div class="top-right">
    <button class="back-btn" onclick="window.location.href='{{ url_for('videos') }}'">⬅ Back</button>
</div>

<h1 class="title">
    🌍 {{ video_name }} Quiz
    <span class="ai-badge">🤖 AI Generated</span>
</h1>

<!-- Loading -->
<div id="loadingBox">
    <div class="spinner"></div>
    <h3>🤖 Generating your personalised quiz...</h3>
    <p style="margin-top:12px;opacity:0.8;">Gemini AI is creating fresh questions just for you!</p>
</div>

<!-- Error box -->
<div id="errorBox" style="display:none;max-width:600px;margin:60px auto;background:rgba(255,255,255,0.12);
     backdrop-filter:blur(6px);border-radius:20px;padding:40px;text-align:center;">
    <div style="font-size:50px;margin-bottom:15px;">⚠️</div>
    <h3 id="errorMsg">Quiz generation failed.</h3>
    <p style="margin-top:10px;opacity:0.8;">Please try again or use the standard quiz from the Quizzes section.</p>
    <button onclick="window.location.reload()" style="margin-top:20px;padding:12px 25px;background:#2ecc71;
        color:white;border:none;border-radius:9px;font-size:16px;cursor:pointer;font-family:inherit;">
        🔄 Retry
    </button>
</div>

<!-- Quiz -->
<div class="quizBox" id="quizBox">
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="q-counter" id="qCounter"></div>
    <div class="timer">⏱ Time: <span id="time">30</span>s</div>
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div class="explanation" id="explanation"></div>
</div>

<script>
const VIDEO_ID = {{ video_id }};
let questions = [];
let current   = 0;
let score     = 0;
let timer;

// ── 1. Fetch questions ────────────────────────────────────────────
fetch(`/api/generate-quiz/${VIDEO_ID}`)
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('errorMsg').textContent = data.error;
            document.getElementById('errorBox').style.display = 'block';
            return;
        }
        questions = data.questions;
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('quizBox').style.display    = 'block';
        loadQuestion();
    })
    .catch(() => {
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('errorBox').style.display   = 'block';
    });

// ── 2. Load a question ───────────────────────────────────────────
function loadQuestion() {
    clearInterval(timer);
    const q = questions[current];
    document.getElementById('qCounter').textContent = `Question ${current + 1} of ${questions.length}`;
    document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
    document.getElementById('question').textContent = q.question;
    document.getElementById('explanation').style.display = 'none';

    let html = '';
    q.options.forEach((opt, i) => {
        html += `<div class="option" id="opt${i}" onclick="checkAnswer(${i})">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    document.getElementById('options').innerHTML = html;

    startTimer();
}

// ── 3. Timer ─────────────────────────────────────────────────────
function startTimer() {
    let left = 30;
    document.getElementById('time').textContent = left;
    timer = setInterval(() => {
        left--;
        document.getElementById('time').textContent = left;
        if (left <= 0) { clearInterval(timer); timeUp(); }
    }, 1000);
}

function timeUp() {
    // Highlight correct answer and move on
    const q = questions[current];
    document.getElementById(`opt${q.correct_index}`).classList.add('correct');
    disableOptions();
    showExplanation();
    setTimeout(() => { current++; nextQuestion(); }, 2000);
}

// ── 4. Check answer ──────────────────────────────────────────────
function checkAnswer(selected) {
    clearInterval(timer);
    const q = questions[current];
    const opts = document.querySelectorAll('.option');

    opts[selected].classList.add(selected === q.correct_index ? 'correct' : 'wrong');
    if (selected !== q.correct_index) {
        opts[q.correct_index].classList.add('correct');
    } else {
        score += 10;
    }
    disableOptions();
    showExplanation();
    setTimeout(() => { current++; nextQuestion(); }, 2000);
}

function disableOptions() {
    document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
}

function showExplanation() {
    const exp = document.getElementById('explanation');
    const text = questions[current]?.explanation || '';
    if (text) {
        exp.textContent = '💡 ' + text;
        exp.style.display = 'block';
    }
}

// ── 5. Next question / final screen ──────────────────────────────
function nextQuestion() {
    if (current < questions.length) {
        loadQuestion();
    } else {
        showFinalScreen();
    }
}

function showFinalScreen() {
    const maxScore = questions.length * 10;
    const pct = score / maxScore;

    let trophy = '😔', emoji = '😢 🌍 💔';
    if (pct === 1)        { trophy = '🏆'; emoji = '🌍 😊 🌟'; }
    else if (pct >= 0.5)  { trophy = '🥈'; emoji = '🌍 😊 🌿'; }

    // Save score to backend
    const fd = new FormData();
    fd.append('video_id',       VIDEO_ID);
    fd.append('score',          score);
    fd.append('max_score',      maxScore);
    fd.append('questions_json', JSON.stringify(questions));
    fetch('/api/submit-dynamic-quiz', { method: 'POST', body: fd });

    document.getElementById('quizBox').innerHTML = `
        <div class="result">
            <div class="emoji">${trophy}</div>
            <div style="font-size:40px;margin:10px 0">${emoji}</div>
            <p>Your Score: <strong>${score} / ${maxScore}</strong></p>
            <p style="margin-top:12px;font-size:16px;color:#555;">
                ${pct >= 0.5 ? '🌱 Great job! You are protecting our planet!' : '💪 Keep learning and try again!'}
            </p>
            <div style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <button onclick="window.location.reload()"
                    style="padding:11px 22px;background:#2ecc71;color:white;border:none;
                           border-radius:9px;font-size:15px;cursor:pointer;font-family:inherit;">
                    🔄 Try Again (New Questions)
                </button>
                <button onclick="window.location.href='{{ url_for('videos') }}'"
                    style="padding:11px 22px;background:#3498db;color:white;border:none;
                           border-radius:9px;font-size:15px;cursor:pointer;font-family:inherit;">
                    ⬅ Back to Videos
                </button>
            </div>
        </div>`;
}
</script>

</body>
</html>
